name: Metrics

on:
  schedule:
    - cron: "0 3 * * 0" # Sundays 3 AM UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: golden006
          template: classic
          base: header, repositories, community, metadata
          config_timezone: America/Denver
          config_output: svg
          config_twemoji: yes
          plugin_isocalendar: yes
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_threshold: 2%
          plugin_stars: yes
          filename: metrics.svg
          output_action: commit
          committer_branch: output
          committer_token: ${{ secrets.METRICS_TOKEN }}
          committer_message: "chore: update metrics.svg [skip ci]"

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: golden006
          template: classic
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          filename: isocalendar.svg
          output_action: commit
          committer_branch: output
          committer_token: ${{ secrets.METRICS_TOKEN }}
          committer_message: "chore: update isocalendar.svg [skip ci]"